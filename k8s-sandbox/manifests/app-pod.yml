apiVersion: v1
kind: Pod
metadata:
  name: app-__PROJECT_ID__
  namespace: forge
  labels:
    k8s-sandbox.dev/project-id: __PROJECT_ID__
spec:
  automountServiceAccountToken: false
  initContainers:
    - name: workspace-init
      image: ghcr.io/harshit-rv/forge-workspace-init:latest
      volumeMounts:
        - name: workspace
          mountPath: /workspace
      env:
        - name: PROJECT_ID
          value: "__PROJECT_ID__"
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: forge-config
              key: S3_BUCKET
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: forge-config
              key: S3_ENDPOINT
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: forge-config
              key: S3_REGION
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-backup-secret
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-backup-secret
              key: secret-access-key
  containers:
    - name: react-app-container
      image: node:22
      command: ["sleep", "infinity"]
      workingDir: /workspace
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      emptyDir: {}
