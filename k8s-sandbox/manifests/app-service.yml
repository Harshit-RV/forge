apiVersion: v1
kind: Service
metadata:
  name: app-__PROJECT_ID__
  namespace: forge
  labels:
    k8s-sandbox.dev/project-id: __PROJECT_ID__
spec:
  type: ClusterIP
  selector:
    k8s-sandbox.dev/project-id: __PROJECT_ID__
  ports:
    - name: http
      port: 80
      targetPort: __DEV_SERVER_PORT__
      protocol: TCP
